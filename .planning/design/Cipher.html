<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cipher — Front-end exploration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+Runic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/cipher-styles.css">
  <style>
    html, body { margin: 0; padding: 0; background: #1a1816; font-family: 'JetBrains Mono', monospace; color: #c4b49a; min-height: 100vh; }
    .page { padding: 36px 24px 80px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
    .page-head { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 6px; padding: 0 8px; }
    .page-title { font-size: 11px; letter-spacing: 0.4em; color: #d4a843; text-transform: uppercase; }
    .page-sub { font-size: 11px; color: #707070; letter-spacing: 0.06em; line-height: 1.7; max-width: 540px; }
    .device-row { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
    .device-frame-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .device-label { font-size: 9px; letter-spacing: 0.3em; color: #707070; text-transform: uppercase; }
    .scenario-bar { width: 100%; max-width: 1200px; display: flex; gap: 6px; flex-wrap: wrap; padding: 0 8px; align-items: center; }
    .scenario-bar .scen-label { font-size: 9px; letter-spacing: 0.3em; color: #707070; text-transform: uppercase; margin-right: 8px; }
    .scen-btn { background: rgba(212,168,67,0.08); border: 1px solid rgba(212,168,67,0.2); color: #c4b49a; font-family: inherit; font-size: 10px; letter-spacing: 0.18em; padding: 7px 12px; cursor: pointer; text-transform: uppercase; transition: all 0.15s; }
    .scen-btn:hover { border-color: #d4a843; color: #d4a843; }
    .scen-btn.active { background: rgba(212,168,67,0.2); color: #ecc96a; border-color: #d4a843; }
    .canvas-section-head { width: 100%; max-width: 1200px; padding: 28px 8px 0; border-top: 1px solid rgba(212,168,67,0.15); margin-top: 16px; }
    .canvas-host { width: 100%; height: 1500px; border: 1px solid rgba(212,168,67,0.15); background: #0a0908; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/cipher-data.jsx"></script>
  <script type="text/babel" src="src/cipher-app.jsx"></script>
  <script type="text/babel" src="src/cipher-variants.jsx"></script>
  <script type="text/babel" src="src/cipher-logos.jsx"></script>
  <script type="text/babel" src="src/cipher-bold.jsx"></script>
  <script type="text/babel" data-presets="react">
    function PageRoot() {
      const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
        "accentHue": 280,
        "flipStyle": "y"
      }/*EDITMODE-END*/;

      const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
      const [scen, setScen] = React.useState('chat-cheryl-flipped');

      const SCENARIOS = [
        { id: 'auth',         label: 'Auth' },
        { id: 'inbox',        label: 'Inbox' },
        { id: 'chat-cheryl',  label: 'Chat · Locked' },
        { id: 'chat-cheryl-flipped', label: 'Chat · Mid-decode' },
        { id: 'chat-rune',    label: 'Chat · Auto' },
        { id: 'new',          label: 'New invite' },
        { id: 'settings',     label: 'Settings' },
      ];

      const initialScreen = scen === 'chat-cheryl-flipped' ? 'chat-cheryl' : scen;
      const demoMode = scen === 'chat-cheryl-flipped' ? 'mid-decode' : 'live';

      const App = window.CipherApp;
      const IOS = window.IOSDevice;
      const And = window.AndroidDevice;
      const DC = window.DesignCanvas;
      const DCSec = window.DCSection;
      const DCArt = window.DCArtboard;
      const TP = window.TweaksPanel;
      const TSec = window.TweakSection;
      const TRad = window.TweakRadio;
      const TSel = window.TweakSelect;
      const V = window.CipherVariants;

      return (
        <div className="page">
          <div className="page-head">
            <div className="page-title">CIPHER · FRONT-END EXPLORATION</div>
            <div className="page-sub">
              Interactive prototype across both platforms · Tap any locked bubble to decode · Top-row scenarios switch screens · Tweaks (top-right) shifts accent hue and flip style.
            </div>
          </div>

          <div className="scenario-bar">
            <span className="scen-label">SCENARIO</span>
            {SCENARIOS.map(s => (
              <button key={s.id}
                className={`scen-btn ${scen === s.id ? 'active' : ''}`}
                onClick={() => setScen(s.id)}>{s.label}</button>
            ))}
          </div>

          <div className="device-row">
            <div className="device-frame-wrap">
              <IOS width={390} height={780} dark={true} title="Cipher">
                <App key={`ios-${scen}`} initialScreen={initialScreen}
                  flipStyle={tweaks.flipStyle} accentHue={tweaks.accentHue} demoMode={demoMode} />
              </IOS>
              <div className="device-label">iOS · iPhone</div>
            </div>
            <div className="device-frame-wrap">
              <And width={390} height={780} dark={true} title="Cipher">
                <App key={`and-${scen}`} initialScreen={initialScreen}
                  flipStyle={tweaks.flipStyle} accentHue={tweaks.accentHue} demoMode={demoMode} />
              </And>
              <div className="device-label">Android · Pixel</div>
            </div>
          </div>

          <div className="canvas-section-head">
            <div className="page-title" style={{ marginBottom: 6 }}>VARIANTS · STATIC EXPLORATIONS</div>
            <div className="page-sub">
              Card-flip styles, cipher-specific typography, and bolder cipher-flavored takes.
              Drag artboards to reorder · click any artboard to focus.
            </div>
          </div>

          <div className="canvas-host">
            <DC>
              <DCSec id="logos" title="Logo explorations" subtitle="Marks for app icon, splash, invite link, merch · ordered loosest → boldest">
                <DCArt id="logo-rotor"     label="01 · Rotor"      width={260} height={360}><window.CipherLogos.LogoRotor /></DCArt>
                <DCArt id="logo-glyphswap" label="02 · Glyph swap" width={260} height={360}><window.CipherLogos.LogoGlyphSwap /></DCArt>
                <DCArt id="logo-bracket"   label="03 · Bracket"    width={260} height={360}><window.CipherLogos.LogoBracket /></DCArt>
                <DCArt id="logo-caesar"    label="04 · Caesar shift" width={260} height={360}><window.CipherLogos.LogoCaesar /></DCArt>
                <DCArt id="logo-polybius"  label="05 · Polybius"   width={260} height={360}><window.CipherLogos.LogoPolybius /></DCArt>
                <DCArt id="logo-aperture"  label="06 · Aperture"   width={260} height={360}><window.CipherLogos.LogoAperture /></DCArt>
                <DCArt id="logo-terminal"  label="07 · Terminal"   width={260} height={360}><window.CipherLogos.LogoTerminal /></DCArt>
                <DCArt id="logo-seal"      label="08 · Seal"       width={260} height={360}><window.CipherLogos.LogoSeal /></DCArt>
                <DCArt id="logo-athandle"  label="09 · @handle"    width={260} height={360}><window.CipherLogos.LogoAtHandle /></DCArt>
              </DCSec>

              <DCSec id="flip" title="Card-flip styles" subtitle="The hero decode interaction">
                <DCArt id="y-flip" label="A · Classic Y-flip" width={300} height={500}><V.VariantYFlip /></DCArt>
                <DCArt id="x-flip" label="B · Envelope X-flip" width={300} height={500}><V.VariantXFlip /></DCArt>
                <DCArt id="dissolve" label="C · Rune dissolve" width={300} height={500}><V.VariantDissolve /></DCArt>
              </DCSec>
              <DCSec id="cipher-type" title="Cipher-specific typography" subtitle="Each cipher gets its own visual voice on the locked face">
                <DCArt id="morse" label="Morse" width={320} height={500}><V.VariantMorse /></DCArt>
                <DCArt id="futhark" label="Futhark" width={320} height={500}><V.VariantFuthark /></DCArt>
                <DCArt id="polybius" label="Polybius" width={320} height={500}><V.VariantPolybius /></DCArt>
              </DCSec>
              <DCSec id="bold" title="Bolder takes" subtitle="Push the cipher metaphor visually">
                <DCArt id="wheel" label="Cipher wheel · Caesar/Vigenère decode visual" width={340} height={500}><V.VariantWheel /></DCArt>
                <DCArt id="hero" label="Hero treatment · One sealed message" width={340} height={500}><V.VariantHero /></DCArt>
                <DCArt id="wax-seal" label="Wax seal · Tactile decode" width={340} height={500}><window.CipherBold.VariantWaxSeal /></DCArt>
                <DCArt id="scrub" label="Scrub decode · Drag-to-decrypt" width={340} height={500}><window.CipherBold.VariantScrub /></DCArt>
                <DCArt id="redaction" label="Redaction · Black-bar fade" width={340} height={500}><window.CipherBold.VariantRedaction /></DCArt>
                <DCArt id="punchtape" label="Punch tape · Physical artifact" width={340} height={500}><window.CipherBold.VariantPunchTape /></DCArt>
                <DCArt id="constellation" label="Constellation · Star-map decode" width={340} height={500}><window.CipherBold.VariantConstellation /></DCArt>
              </DCSec>
              <DCSec id="inbox" title="Inbox density" subtitle="How loud should cipher metadata be?">
                <DCArt id="inbox-min" label="Minimal · No previews" width={300} height={500}><V.VariantInboxMinimal /></DCArt>
                <DCArt id="inbox-loud" label="Cipher-tagged · Loud" width={300} height={500}><V.VariantInboxCipherful /></DCArt>
              </DCSec>
              <DCSec id="compose" title="Compose bar states" subtitle="Locked vs auto-decode mode">
                <DCArt id="compose-locked" label="Locked mode · key field shown" width={320} height={220}><V.VariantComposeCollapsed /></DCArt>
                <DCArt id="compose-auto" label="Auto-decode active" width={320} height={220}><V.VariantComposeAuto /></DCArt>
              </DCSec>
              <DCSec id="invite" title="Invite landing" subtitle="Recipient's first impression — what builds trust">
                <DCArt id="invite-landing" label="Recipient lands here pre-auth" width={320} height={600}><V.VariantInviteLanding /></DCArt>
              </DCSec>
            </DC>
          </div>

          <TP title="Tweaks">
            <TSec title="Aesthetic">
              <TSel label="Accent hue" value={String(tweaks.accentHue)}
                onChange={v => setTweak('accentHue', parseInt(v))}
                options={[
                  { value: '42', label: 'Amber (default)' },
                  { value: '140', label: 'Green' },
                  { value: '200', label: 'Cyan' },
                  { value: '280', label: 'Violet' },
                  { value: '20', label: 'Red' },
                ]} />
              <TRad label="Card-flip axis" value={tweaks.flipStyle}
                onChange={v => setTweak('flipStyle', v)}
                options={[
                  { value: 'y', label: 'Y · Classic' },
                  { value: 'x', label: 'X · Envelope' },
                ]} />
            </TSec>
          </TP>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PageRoot />);
  </script>
</body>
</html>
